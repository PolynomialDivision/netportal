<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f6f5f">
  <meta name="robots" content="noindex">
  <title>{{ settings.display_name }} · {{ t.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{# Icons as an inline sprite: the CSP allows no inline styles or scripts, inline SVG is fine. #}
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 8.5a14 14 0 0 1 19 0M5.5 12a9.5 9.5 0 0 1 13 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></symbol>
  <symbol id="i-app" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12h6M12 9v6"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="3.5"/><path d="M11.5 12H21M18 12v3M15 12v2"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
  <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4.5-6"/></symbol>
</svg>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">
    <svg class="icon" aria-hidden="true"><use href="#i-wifi"/></svg>
    <span class="brand-name">{{ settings.display_name }}</span>
    <span class="brand-sub">{{ t.title }}</span>
  </a>
  {% if user %}
  <nav class="session" aria-label="Account">
    <span class="who">{{ user.name }}</span>
    {% if user.admin %}<a class="pill" href="{{ url_for('admin') }}"><svg class="icon" aria-hidden="true"><use href="#i-people"/></svg>{{ t.admin }}</a>{% endif %}
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="pill">{{ t.logout }}</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% block body %}{% endblock %}
</main>
<footer>
  <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
  <p>{{ t.privacy }}</p>
</footer>
</body>
</html>

# cargo deny check (https://embarkstudios.github.io/cargo-deny/): licenses, bans, advisories,
# sources. Run by check.sh when cargo-deny is installed (cargo install cargo-deny).

[graph]
all-features = false
# what is built and shipped: the image (Dockerfile) and the developers' machines
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# Each ignored advisory with the reason it does not apply; keep .cargo/audit.toml (cargo audit)
# in step. Re-check whenever openidconnect (the only path to both crates) has a new release.
ignore = [
    # rsa 0.9 (Marvin, no fixed release): openidconnect verifies RS256 ID-token signatures with
    # Authentik's public key; the attack needs a private-key operation (decryption/signing) the
    # portal never does with this crate (its own keys are EC, in OpenSSL).
    { id = "RUSTSEC-2023-0071", reason = "rsa: public-key verification only (openidconnect ID tokens); no private RSA key in the process" },
    # crypto-bigint 0.5 (non-constant-time arithmetic; fixed in 0.7.6, which elliptic-curve 0.13
    # and so openidconnect 4.0.1, the latest, cannot use): reached only through p256/p384 for
    # ES256/ES384 ID-token verification, on public values (the issuer's key, the signature).
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via elliptic-curve 0.13: ECDSA verification of public ID tokens only; no secret integers" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# permissive licenses only (what the dependency tree uses today)
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# the workspace's own crates are not published
ignore = true

[bans]
# sqlx and the crypto crates still pull older digest/base64 versions: visible, not fatal
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # one TLS stack (rustls): no native-tls / OpenSSL for TLS (openssl is used for X.509 and PKCS#12 only)
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
